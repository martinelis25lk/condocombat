name: 🚀 Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI", "Deploy Landing Page"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform-deploy:
    name: 🏗️ Provisionar e Fazer Deploy da Infraestrutura
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (build da Landing Page)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: landing/package-lock.json

      - name: 📦 Build da Landing Page (gera landing/dist)
        working-directory: ./landing
        run: |
          npm ci
          npm run build

      - name: ⚙️ Configurar a versão mais recente do Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"



      - name: 💾 Restaurar Terraform State (cache)
        uses: actions/cache/restore@v4
        with:
          path: terraform/terraform.tfstate
          key: terraform-state-${{ github.run_id }}
          restore-keys: |
            terraform-state-

      - name: 🔍 Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: 📋 Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan
        env:
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TF_VAR_supabase_organization_id: ${{ secrets.SUPABASE_ORGANIZATION_ID }}
          TF_VAR_supabase_db_password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TF_VAR_render_api_key: ${{ secrets.RENDER_API_KEY }}
          TF_VAR_render_owner_id: ${{ secrets.RENDER_OWNER_ID }}
          TF_VAR_backend_secret_key: ${{ secrets.BACKEND_SECRET_KEY }}
          TF_VAR_netlify_api_token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          TF_VAR_netlify_site_name: ${{ secrets.NETLIFY_SITE_NAME }}
          TF_VAR_netlify_team_id: ${{ secrets.NETLIFY_TEAM_ID }}

      - name: 🚀 Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TF_VAR_supabase_organization_id: ${{ secrets.SUPABASE_ORGANIZATION_ID }}
          TF_VAR_supabase_db_password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TF_VAR_render_api_key: ${{ secrets.RENDER_API_KEY }}
          TF_VAR_render_owner_id: ${{ secrets.RENDER_OWNER_ID }}
          TF_VAR_backend_secret_key: ${{ secrets.BACKEND_SECRET_KEY }}
          TF_VAR_netlify_api_token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          TF_VAR_netlify_site_name: ${{ secrets.NETLIFY_SITE_NAME }}
          TF_VAR_netlify_team_id: ${{ secrets.NETLIFY_TEAM_ID }}
      
      - name: 💾 Salvar Terraform State (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: terraform/terraform.tfstate
          key: terraform-state-${{ github.run_id }}
      